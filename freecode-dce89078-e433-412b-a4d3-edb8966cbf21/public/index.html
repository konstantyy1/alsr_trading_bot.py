<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terminal</title>
<meta name="robots" content="noindex,nofollow" />
<style>
  :root{
    --ink:#0A1014; --panel:#101A20; --panel-2:#0D1519; --line:#1E2C34; --line-soft:#17242B;
    --text:#E6EEF1; --muted:#8AA0AB; --brass:#D6A15F; --brass-dim:#8A6A41;
    --up:#4FB68A; --down:#D4666F; --warn:#E0C065;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{font-size:14px;line-height:1.5}
  a{color:var(--brass);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1280px;margin:0 auto;padding:0 20px 64px}
  /* ---------- masthead ---------- */
  header.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0C1519,#0A1014);position:sticky;top:0;z-index:20}
  .top-in{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-size:15px;letter-spacing:.02em;font-weight:650}
  .brand span{color:var(--muted);font-size:11px;font-family:var(--mono);letter-spacing:.06em}
  .ticker{display:flex;align-items:baseline;gap:14px;margin-left:auto;flex-wrap:wrap}
  .tick-price{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .tick-meta{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:2px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .pill.ok{color:var(--up);border-color:#204539}
  .pill.bad{color:var(--down);border-color:#4a2529}
  .pill.warn{color:var(--warn);border-color:#4a4020}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
  /* ---------- nav ---------- */
  nav.tabs{display:flex;gap:2px;max-width:1280px;margin:0 auto;padding:0 20px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--ink)}
  nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--sans);font-size:13px;padding:12px 14px;cursor:pointer;white-space:nowrap}
  nav.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--brass)}
  nav.tabs button:hover{color:var(--text)}
  /* ---------- layout ---------- */
  .grid{display:grid;gap:16px;margin-top:20px}
  .cols-2{grid-template-columns:1.35fr 1fr;align-items:start}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:980px){.cols-2,.cols-3{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:18px}
  .card h2{font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card h2 em{font-style:normal;color:var(--brass-dim);letter-spacing:.04em;text-transform:none;font-size:11px}
  .stack{display:flex;flex-direction:column;gap:16px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line-soft)}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--muted);font-size:12.5px}
  .row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right}
  .big{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .muted{color:var(--muted)}
  /* ---------- hero rail ---------- */
  .rail{position:relative;overflow:hidden;padding:20px 18px 14px}
  .rail .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .rail .price{font-family:var(--mono);font-size:46px;line-height:1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .rail .sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
  canvas{display:block;width:100%;height:120px;margin-top:12px}
  .bias{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .bias .b{flex:1;min-width:74px;border:1px solid var(--line);padding:8px 10px;border-radius:2px;background:var(--panel-2)}
  .bias .b small{display:block;color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.08em}
  .bias .b b{font-family:var(--mono);font-size:13px;font-weight:600}
  /* ---------- score bar ---------- */
  .seg{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
  .seg i{width:5px;height:14px;background:var(--line);border-radius:1px;display:block}
  .seg i.on{background:var(--brass)}
  .seg i.on.hi{background:var(--up)}
  /* ---------- signal card ---------- */
  .sig{border:1px solid var(--line);border-left:3px solid var(--brass);padding:14px 16px;border-radius:2px;background:var(--panel-2);margin-bottom:12px}
  .sig.buy{border-left-color:var(--up)} .sig.sell{border-left-color:var(--down)}
  .sig .topline{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .sig .id{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .sig .lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;font-family:var(--mono);font-size:12px}
  @media(max-width:640px){.sig .lvls{grid-template-columns:repeat(2,1fr)}}
  .sig .lvls div small{display:block;color:var(--muted);font-size:10px;letter-spacing:.06em;margin-bottom:2px}
  .sig ul{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:12.5px}
  .sig ul li{margin-bottom:3px}
  /* ---------- table ---------- */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-variant-numeric:tabular-nums}
  td.txt{font-family:var(--sans)}
  tbody tr:hover{background:#0C161B}
  .tag{font-family:var(--mono);font-size:10px;padding:2px 6px;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
  /* ---------- empty / error ---------- */
  .empty{border:1px dashed var(--line);padding:22px;color:var(--muted);font-size:13px;border-radius:2px}
  .empty b{color:var(--text)}
  .banner{border:1px solid #4a4020;background:#191708;color:var(--warn);padding:10px 14px;border-radius:2px;font-size:12.5px;margin-top:16px}
  .banner.bad{border-color:#4a2529;background:#1a0f11;color:var(--down)}
  .note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.55}
  /* ---------- svg spark ---------- */
  .spark{width:74px;height:22px;vertical-align:middle}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>TERMINAL</b><span>EUR/USD · WARSAW</span></div>
    <div class="ticker">
      <div>
        <div class="tick-price" id="mastPrice">—</div>
        <div class="tick-meta" id="mastMeta">завантаження…</div>
      </div>
      <span class="pill" id="pillData">дані</span>
      <span class="pill" id="pillSession">сесія</span>
      <span class="pill" id="pillTg">telegram</span>
    </div>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Розділи">
  <button role="tab" aria-selected="true" data-tab="overview">Огляд</button>
  <button role="tab" aria-selected="false" data-tab="setups">Сценарії</button>
  <button role="tab" aria-selected="false" data-tab="calendar">Календар</button>
  <button role="tab" aria-selected="false" data-tab="news">Новини</button>
  <button role="tab" aria-selected="false" data-tab="analytics">Аналітика</button>
  <button role="tab" aria-selected="false" data-tab="health">Стан</button>
</nav>

<main class="wrap">
  <div id="banners"></div>
  <section id="tab-overview" class="tabpane"></section>
  <section id="tab-setups" class="tabpane" hidden></section>
  <section id="tab-calendar" class="tabpane" hidden></section>
  <section id="tab-news" class="tabpane" hidden></section>
  <section id="tab-analytics" class="tabpane" hidden></section>
  <section id="tab-health" class="tabpane" hidden></section>

  <footer>
    <span>Приватна аналітика. Реальні накази брокеру не надсилаються; облік результатів віртуальний.</span>
    <span id="footUpdated">—</span>
  </footer>
</main>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const f5 = n => (typeof n === "number" && isFinite(n)) ? n.toFixed(5) : "—";
const pct = n => (typeof n === "number") ? (n*100).toFixed(1) + "%" : "—";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt = ts => ts ? new Date(ts).toLocaleString("uk-UA",{timeZone:"Europe/Warsaw",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
const tm = ts => ts ? new Date(ts).toLocaleTimeString("uk-UA",{timeZone:"Europe/Warsaw",hour:"2-digit",minute:"2-digit"}) : "—";

let state = { market:null, signals:[], stats:null, events:[], status:null, decisions:[], tab:"overview" };

async function getJSON(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error(url+" → "+r.status); return r.json(); }

async function loadAll(){
  const tasks = [
    getJSON("/api/market").catch(e=>({error:e.message})),
    getJSON("/api/signals?limit=40").catch(()=>({signals:[]})),
    getJSON("/api/stats").catch(()=>null),
    getJSON("/api/calendar").catch(()=>({events:[]})),
    getJSON("/api/status").catch(()=>null),
    getJSON("/api/decisions?limit=12").catch(()=>({decisions:[]})),
  ];
  const [market, signals, stats, cal, status, dec] = await Promise.all(tasks);
  state.market = market; state.signals = signals.signals || []; state.signalsDemo = !!signals.demo;
  state.stats = stats;
  state.events = cal.events || []; state.status = status; state.decisions = dec.decisions || [];
  renderMast(); renderBanners(); renderTab();
  $("#footUpdated").textContent = "Оновлено " + new Date().toLocaleTimeString("uk-UA",{timeZone:"Europe/Warsaw"}) + " Europe/Warsaw";
}

function renderMast(){
  const m = state.market || {};
  const q = m.quote;
  const p = $("#mastPrice"), meta = $("#mastMeta");
  if (q) {
    p.textContent = f5(q.mid);
    p.className = "tick-price " + (m.frames?.M5?.structure === "bull" ? "up" : m.frames?.M5?.structure === "bear" ? "down" : "");
    meta.textContent = `bid ${f5(q.bid)} · ask ${f5(q.ask)} · spread ${q.spreadPips}p · ${m.quoteAgeSec}s`;
  } else { p.textContent = "—"; meta.textContent = "дані недоступні"; }
  const pd = $("#pillData");
  pd.textContent = m.dataQuality || "DATA UNAVAILABLE";
  pd.className = "pill " + (m.dataQuality === "VERIFIED" ? "ok" : m.dataQuality === "UNVERIFIED" ? "warn" : "bad");
  const ps = $("#pillSession");
  ps.textContent = (m.session?.active || "—") + (m.session?.inKillzone ? " · prime" : "");
  ps.className = "pill " + (m.session?.inKillzone ? "ok" : "");
  const pt = $("#pillTg");
  const st = state.status;
  pt.textContent = st?.telegram ? "telegram ok" : "telegram —";
  pt.className = "pill " + (st?.telegram ? "ok" : "warn");
}

function renderBanners(){
  const b = $("#banners"); b.innerHTML = "";
  const m = state.market || {};
  if (m.error) { b.appendChild(el("div","banner bad", `<b>Дані недоступні.</b> ${esc(m.error)}`)); return; }
  if (m.dataQuality === "UNVERIFIED" && (m.quote) && state.status?.dataProvider?.includes("Synthetic")) {
    b.appendChild(el("div","banner", `<b>Демо-потік.</b> Показано синтетичні котирування для перевірки інтерфейсу. Сигнали в такому режимі не вважаються торговими.`));
    return;
  }
  if (state.status?.state?.paused) b.appendChild(el("div","banner", `<b>Сигнали на паузі.</b> Сканування триває, але нові входи в Telegram не надсилаються.`));
  if (state.signalsDemo) b.appendChild(el("div","banner", `<b>Демо-сценарії.</b> Ці картки згенеровані для перевірки інтерфейсу і не є торговими результатами.`));
  if (m.dataQuality === "UNVERIFIED") b.appendChild(el("div","banner", `<b>Дані не підтверджені.</b> Нові сигнали заблоковані. ${esc((m.qualityNotes||[])[0]||"")}`));
}

/* ---------- sparkline ---------- */
function sparkSVG(candles, w=74, h=22){
  if (!candles || candles.length < 2) return "";
  const vals = candles.map(c=>c.c); const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min) || 0.0001;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-((v-min)/span)*(h-4)).toFixed(1)}`).join(" ");
  const last = vals[vals.length-1], first = vals[0];
  const color = last >= first ? "var(--up)" : "var(--down)";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.4"/></svg>`;
}

function drawRail(canvas, candles){
  if (!canvas || !candles || !candles.length) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(10, rect.width*dpr); canvas.height = Math.max(10, rect.height*dpr);
  const ctx = canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0,0,w,h);
  const vals = candles.map(c=>c.c); const min = Math.min(...candles.map(c=>c.l)), max = Math.max(...candles.map(c=>c.h));
  const span = (max-min)||0.0001; const pad = 8;
  const y = v => pad + (h-2*pad) * (1 - (v-min)/span);
  const x = i => (i/(candles.length-1))*w;
  // grid
  ctx.strokeStyle = "rgba(30,44,52,.9)"; ctx.lineWidth = 1;
  for (let g=1; g<=3; g++){ const gy = pad + (h-2*pad)*g/4; ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke(); }
  // area
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"rgba(214,161,95,.22)"); grad.addColorStop(1,"rgba(214,161,95,0)");
  ctx.beginPath(); ctx.moveTo(0,h);
  candles.forEach((c,i)=>ctx.lineTo(x(i), y(c.c)));
  ctx.lineTo(w,h); ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
  // line
  ctx.beginPath(); candles.forEach((c,i)=> i? ctx.lineTo(x(i),y(c.c)) : ctx.moveTo(x(i),y(c.c)));
  ctx.strokeStyle = "#D6A15F"; ctx.lineWidth = 1.6; ctx.stroke();
  // last point
  const last = candles[candles.length-1];
  ctx.beginPath(); ctx.arc(w-1, y(last.c), 2.6, 0, Math.PI*2); ctx.fillStyle = "#E6EEF1"; ctx.fill();
}

/* ---------- tabs ---------- */
function renderTab(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===state.tab)));
  document.querySelectorAll(".tabpane").forEach(p=>p.hidden = p.id !== "tab-"+state.tab);
  const fn = {overview:renderOverview, setups:renderSetups, calendar:renderCalendar, news:renderNews, analytics:renderAnalytics, health:renderHealth}[state.tab];
  fn && fn();
}

function renderOverview(){
  const m = state.market || {}; const pane = $("#tab-overview"); pane.innerHTML="";
  const q = m.quote;
  if (!q){ pane.appendChild(el("div","empty", `<b>DATA UNAVAILABLE.</b> Немає котирувань EUR/USD. Перевір стан джерела на вкладці «Стан».`)); return; }

  const rail = el("div","card rail");
  rail.style.paddingBottom = "22px";
  rail.appendChild(el("div","head", `
    <div><div class="price">${f5(q.mid)}</div>
    <div class="sub">bid ${f5(q.bid)} · ask ${f5(q.ask)} · spread ${q.spreadPips} pips · ${esc(q.provider)}</div></div>
    <div class="sub">оновлено ${m.quoteAgeSec}s тому · ${m.session?.quality || ""}</div>`));
  const cv = document.createElement("canvas"); rail.appendChild(cv);
  const bias = el("div","bias");
  [["H4",m.frames?.H4?.structure],["H1",m.frames?.H1?.structure],["M15",m.frames?.M15?.structure],["M5",m.frames?.M5?.structure]].forEach(([tf,dir])=>{
    const cls = dir==="bull"?"up":dir==="bear"?"down":"muted";
    bias.appendChild(el("div","b", `<small>${tf}</small><b class="${cls}">${dir==="bull"?"bias ↑":dir==="bear"?"bias ↓":dir==="range"?"range":"—"}</b>`));
  });
  rail.appendChild(bias);

  const side = el("div","stack");
  side.appendChild(el("div","card", `
    <h2>Контекст сесії <em>${esc(m.session?.active||"")}</em></h2>
    <div class="row"><span class="k">Варшава</span><span class="v">${esc(m.session?.warsawTime||"—")}</span></div>
    <div class="row"><span class="k">Якість вікна</span><span class="v ${m.session?.inKillzone?"up":""}">${esc(m.session?.quality||"—")}</span></div>
    <div class="row"><span class="k">Killzone</span><span class="v">${esc(m.session?.killzoneLabel||"—")}</span></div>
    <div class="row"><span class="k">London / NY</span><span class="v">${m.session?.londonOpenInMin!=null?m.session.londonOpenInMin+" хв":"відкрито"} / ${m.session?.nyOpenInMin!=null?m.session.nyOpenInMin+" хв":"відкрито"}</span></div>
    <div class="row"><span class="k">ATR M15</span><span class="v">${(m.frames?.M15?.rsi!=null?((m.rails?.[1]?.atr)??"—"):"—")} pips</span></div>
    <div class="row"><span class="k">Новинний ризик</span><span class="v ${m.news?.level==="BLOCKED"?"down":m.news?.level==="ELEVATED"?"warn":"up"}">${esc(m.news?.level||"—")}</span></div>
    <p class="note">${esc(m.news?.reason||"")}</p>`));
  side.appendChild(el("div","card", `
    <h2>Якість даних</h2>
    <div class="row"><span class="k">Статус</span><span class="v ${m.dataQuality==="VERIFIED"?"up":"warn"}">${esc(m.dataQuality)}</span></div>
    <div class="row"><span class="k">Крос-перевірка</span><span class="v">${m.crossCheck?.available?esc((m.crossCheck.deviationPips??"—")+" pips"):"друге джерело відсутнє"}</span></div>
    <div class="row"><span class="k">Остання свічка M5</span><span class="v">${dt(m.rails?.[0]?.candles?.slice(-1)[0]?.t)}</span></div>
    ${(m.qualityNotes||[]).length?`<p class="note">${m.qualityNotes.map(n=>esc(n)).join("<br>")}</p>`:"<p class='note'>Зауважень немає.</p>"}`));

  const cols = el("div","grid cols-2"); cols.appendChild(rail); cols.appendChild(side); pane.appendChild(cols);

  // active setups summary
  const open = state.signals.filter(s=>["READY","ACTIVE","TP1_HIT","TP2_HIT"].includes(s.status));
  const wrap = el("div","grid");
  const card = el("div","card");
  card.appendChild(el("h2",null,`Активні сценарії <em>${open.length}</em>`));
  if (open.length===0) card.appendChild(el("div","empty","<b>Немає активних сценаріїв.</b> Це нормальний стан: система надсилає лише підтверджені входи, а не щодня."));
  else open.slice(0,3).forEach(s=>card.appendChild(signalCard(s)));
  wrap.appendChild(card); pane.appendChild(wrap);
  requestAnimationFrame(()=>drawRail(cv, m.rails?.[0]?.candles||[]));
}

function signalCard(s){
  const segs = Math.round(s.score/5);
  const seg = `<div class="seg">${Array.from({length:20},(_,i)=>`<i class="${i<segs?'on':''} ${s.grade==='A+'&&i<segs?'hi':''}"></i>`).join("")}</div>`;
  const n = el("div","sig "+s.side.toLowerCase());
  n.innerHTML = `
    <div class="topline">
      <div><b class="big">${s.symbol.replace("_","/")} ${s.side}</b> <span class="tag">${esc(s.grade)}</span> <span class="tag">${esc(s.setup)}</span></div>
      <div class="id">${esc(s.id)} · ${dt(s.createdAt)}</div>
    </div>
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:end;margin-top:8px">
      <div><span class="muted" style="font-size:11px">Score</span> <b class="big">${s.score}/100</b>${seg}</div>
      <div class="muted" style="font-size:12px">${esc(s.status)} · R:R 1:${s.rr} · ${s.riskPips}p risk</div>
    </div>
    <div class="lvls">
      <div><small>ENTRY ZONE</small>${f5(s.entryLow)}–${f5(s.entryHigh)}</div>
      <div><small>STOP</small><span class="down">${f5(s.stop)}</span></div>
      <div><small>TP1 / TP2</small><span class="up">${f5(s.tp1)} / ${f5(s.tp2)}</span></div>
      <div><small>HOLD</small>${s.expectedHoldMin}–${s.maxHoldMin} хв</div>
    </div>
    <div class="muted" style="font-size:12px">${esc(s.context.h1)} · ${esc(s.context.liquidity)}</div>
    <details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:12px">Чому цей сетап</summary><ul>${s.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></details>`;
  return n;
}

function renderSetups(){
  const pane = $("#tab-setups"); pane.innerHTML="";
  const groups = {
    "READY / ACTIVE": ["READY","ACTIVE"],
    "TP1 / TP2": ["TP1_HIT","TP2_HIT"],
    "Завершені": ["TP3_HIT","SL_HIT","EXPIRED","CANCELLED","UNDETERMINED"],
  };
  const cols = el("div","stack");
  for (const [label, statuses] of Object.entries(groups)){
    const list = state.signals.filter(s=>statuses.includes(s.status));
    const c = el("div","card");
    c.appendChild(el("h2",null,`${label} <em>${list.length}</em>`));
    if (!list.length) c.appendChild(el("div","empty","Порожньо."));
    else list.forEach(s=>c.appendChild(signalCard(s)));
    cols.appendChild(c);
  }
  pane.appendChild(cols);
}

function renderCalendar(){
  const pane = $("#tab-calendar"); pane.innerHTML="";
  const now = Date.now();
  const upcoming = (state.events||[]).filter(e=>e.timeUtc>=now).sort((a,b)=>a.timeUtc-b.timeUtc).slice(0,20);
  const c = el("div","card");
  c.appendChild(el("h2",null,`Економічний календар <em>офіційні фіди</em>`));
  if (!upcoming.length){
    c.appendChild(el("div","empty","<b>Подій у перевірених фідах немає.</b> Календар заповнюється з офіційних джерел (ECB, Fed, BLS, Eurostat). Числові значення не підставляються, якщо їх не надав фід."));
  } else {
    const t = el("table");
    t.innerHTML = `<thead><tr><th>Час (Warsaw)</th><th>Подія</th><th>Впл.</th><th>Валюта</th><th>Джерело</th></tr></thead><tbody>${upcoming.map(e=>`
      <tr><td>${dt(e.timeUtc)}</td><td class="txt">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:esc(e.title)}</td>
      <td><span class="tag" style="color:${e.impact==='high'?'var(--down)':e.impact==='medium'?'var(--warn)':'var(--muted)'}">${esc(e.impact)}</span></td>
      <td>${esc(e.currency)}</td><td>${esc(e.source)}</td></tr>`).join("")}</tbody>`;
    c.appendChild(t);
  }
  c.appendChild(el("p","note","Actual / forecast / previous показуються лише тоді, коли їх надав перевірений фід. Відсутні значення не трактуються як нуль."));
  pane.appendChild(c);
}

function renderNews(){
  const pane = $("#tab-news"); pane.innerHTML="";
  const now = Date.now();
  const published = (state.events||[]).filter(e=>e.timeUtc<=now).sort((a,b)=>b.timeUtc-a.timeUtc).slice(0,25);
  const c = el("div","card");
  c.appendChild(el("h2",null,`Новини EUR/USD <em>${published.length}</em>`));
  if (!published.length){ c.appendChild(el("div","empty","<b>Нових релізів немає.</b> Офіційні фіди оновлюються під час сканування.")); }
  else {
    const t = el("table");
    t.innerHTML = `<thead><tr><th>Час</th><th>Заголовок</th><th>Джерело</th></tr></thead><tbody>${published.map(e=>`
      <tr><td>${dt(e.timeUtc)}</td><td class="txt">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:esc(e.title)}</td><td>${esc(e.source)}</td></tr>`).join("")}</tbody>`;
    c.appendChild(t);
  }
  pane.appendChild(c);
}

function renderAnalytics(){
  const pane = $("#tab-analytics"); pane.innerHTML="";
  const st = state.stats?.stats; const risk = state.stats?.risk;
  if (!st){ pane.appendChild(el("div","empty","Статистика недоступна.")); return; }
  const kpis = el("div","grid cols-3");
  const kpi = (k,v,sub,cls="") => el("div","card",`<h2>${k}</h2><div class="big ${cls}" style="font-size:28px">${v}</div><p class="note">${sub||""}</p>`);
  kpis.appendChild(kpi("Win rate", st.winRate!=null?pct(st.winRate):"—", `${st.resolved} завершених угод`));
  kpis.appendChild(kpi("Expectancy", st.expectancyR!=null?`${st.expectancyR}R`:"—", `Сумарно ${st.totalR}R · PF ${st.profitFactor ?? "—"}`));
  kpis.appendChild(kpi("Max drawdown", `${st.maxDrawdownR}R`, `Сер. час ${st.avgHoldMin ?? "—"} хв`));
  pane.appendChild(kpis);
  if (st.sampleWarning) pane.appendChild(el("div","banner",esc(st.sampleWarning)));

  const eq = state.stats?.equity||[];
  const c = el("div","card");
  c.appendChild(el("h2",null,`Крива капіталу <em>віртуальний облік, ${risk?.riskPercent ?? "—"}% ризику</em>`));
  if (eq.length<2) c.appendChild(el("div","empty","<b>Ще немає завершених угод.</b> Крива з'явиться після перших закритих сценаріїв."));
  else {
    const w=900,h=180,pad=10; const vals=eq.map(p=>p.equity); const min=Math.min(...vals),max=Math.max(...vals); const span=(max-min)||1;
    const pts = eq.map((p,i)=>`${(i/(eq.length-1)*w).toFixed(1)},${(h-pad-((p.equity-min)/span)*(h-2*pad)).toFixed(1)}`).join(" ");
    c.innerHTML += `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:180px" preserveAspectRatio="none" role="img" aria-label="Крива капіталу">
      <polyline points="${pts}" fill="none" stroke="var(--brass)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
      <div class="row"><span class="k">Старт</span><span class="v">${risk?.accountEquity ?? "—"} USD</span></div>
      <div class="row"><span class="k">Зараз</span><span class="v ${vals[vals.length-1]>=vals[0]?"up":"down"}">${vals[vals.length-1]} USD</span></div>`;
  }
  pane.appendChild(c);

  const cols = el("div","grid cols-2");
  const grp = (title,obj) => {
    const card = el("div","card"); card.appendChild(el("h2",null,title));
    const keys = Object.keys(obj||{});
    if(!keys.length) card.appendChild(el("div","empty","Немає даних."));
    else card.appendChild(el("table",null,`<thead><tr><th>Група</th><th>N</th><th>R</th><th>Win</th></tr></thead><tbody>${keys.map(k=>`<tr><td class="txt">${esc(k)}</td><td>${obj[k].n}</td><td class="${obj[k].r>0?'up':obj[k].r<0?'down':''}">${obj[k].r>0?'+':''}${obj[k].r}</td><td>${obj[k].winRate!=null?pct(obj[k].winRate):"—"}</td></tr>`).join("")}</tbody>`));
    return card;
  };
  cols.appendChild(grp("За сесіями", st.bySession)); cols.appendChild(grp("За типами сетапів", st.bySetup));
  pane.appendChild(cols);
  pane.appendChild(el("div","card",`<h2>TP-досяжність</h2>
    <div class="row"><span class="k">Дійшли до TP1</span><span class="v">${st.tp1Rate!=null?pct(st.tp1Rate):"—"}</span></div>
    <div class="row"><span class="k">Дійшли до TP2</span><span class="v">${st.tp2Rate!=null?pct(st.tp2Rate):"—"}</span></div>
    <div class="row"><span class="k">Дійшли до TP3</span><span class="v">${st.tp3Rate!=null?pct(st.tp3Rate):"—"}</span></div>
    <p class="note">Частки рахуються від усіх сигналів, включно з відкритими.</p>`));
}

function renderHealth(){
  const pane = $("#tab-health"); pane.innerHTML="";
  const s = state.status; const m = state.market||{};
  if (!s){ pane.appendChild(el("div","empty","Немає даних про стан.")); return; }
  const cols = el("div","grid cols-2");
  const left = el("div","card",`
    <h2>Стан системи</h2>
    <div class="row"><span class="k">Telegram</span><span class="v ${s.telegram?'up':'down'}">${s.telegram?'налаштовано':'немає токена/chat id'}</span></div>
    <div class="row"><span class="k">Джерело даних</span><span class="v">${esc(s.dataProvider)}</span></div>
    <div class="row"><span class="k">Валідатор</span><span class="v">${esc(s.validator||'не налаштований')}</span></div>
    <div class="row"><span class="k">Планувальник</span><span class="v" style="font-size:11px">${esc(s.scheduler||'')}</span></div>
    <div class="row"><span class="k">Останній запуск</span><span class="v">${dt(s.state?.lastRunAt)}</span></div>
    <div class="row"><span class="k">Останній успіх</span><span class="v">${dt(s.state?.lastOkAt)}</span></div>
    <div class="row"><span class="k">Запусків сьогодні</span><span class="v">${s.state?.runsToday ?? 0}</span></div>
    <div class="row"><span class="k">Сигнали</span><span class="v ${s.state?.paused?'warn':'up'}">${s.state?.paused?'пауза':'активні'}</span></div>
    ${s.state?.lastError?`<p class="note" style="color:var(--down)">Остання помилка: ${esc(s.state.lastError)}</p>`:""}`);
  const right = el("div","card");
  right.appendChild(el("h2",null,"Останні логи"));
  if (!(s.logs||[]).length) right.appendChild(el("div","empty","Логів ще немає."));
  else right.appendChild(el("table",null,`<tbody>${s.logs.map(l=>`<tr><td style="width:88px">${tm(l.at)}</td><td><span class="tag" style="color:${l.level==='error'?'var(--down)':l.level==='warn'?'var(--warn)':'var(--muted)'}">${esc(l.level)}</span></td><td class="txt">${esc(l.scope)}: ${esc(l.message)}</td></tr>`).join("")}</tbody>`));
  cols.appendChild(left); cols.appendChild(right); pane.appendChild(cols);

  const notes = el("div","card");
  notes.appendChild(el("h2",null,"Самоперевірка логіки"));
  notes.appendChild(el("div","empty","Запуск тестів…"));
  pane.appendChild(notes);
  fetch("/api/selftest",{cache:"no-store"}).then(r=>r.json()).then(res=>{
    notes.innerHTML = `<h2>Самоперевірка логіки <em>${res.passed} з ${res.passed+res.failed} пройдено</em></h2>`;
    if (res.failed>0) notes.appendChild(el("div","banner bad",`<b>${res.failed} тест(ів) не пройдено.</b> Деталі нижче.`));
    const t = el("table");
    t.innerHTML = `<thead><tr><th>Тест</th><th>Результат</th><th>Деталі</th></tr></thead><tbody>${(res.cases||[]).map(c=>`
      <tr><td class="txt">${esc(c.name)}</td><td class="${c.pass?'up':'down'}">${c.pass?'passed':'failed'}</td><td class="txt muted">${esc(c.detail||'')}</td></tr>`).join("")}</tbody>`;
    notes.appendChild(t);
  }).catch(e=>{
    notes.innerHTML = `<h2>Самоперевірка логіки</h2>`;
    notes.appendChild(el("div","empty",`Тести недоступні: ${esc(e.message)}`));
  });

  const limits = el("div","card");
  limits.appendChild(el("h2",null,"Обмеження безкоштовного тарифу"));
  limits.appendChild(el("ul","note",`
    <li>Сканування запускає зовнішній cron раз на 5 хвилин; без нього система не оновлюється.</li>
    <li>Холодний старт воркера може затримувати відповідь на 1–3 секунди; пропущений запуск фіксується в логах.</li>
    <li>Стан збережено в D1, тому рестарт не втрачає історію сигналів.</li>
    <li>Постачальники новин і котирувань можуть тимчасово не відповідати — тоді статус стає UNVERIFIED і нові входи блокуються.</li>
  `));
  limits.querySelector("ul").style.paddingLeft = "16px";
  pane.appendChild(limits);
}

document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{ state.tab=b.dataset.tab; renderTab(); }));
window.addEventListener("resize", ()=>{ if(state.tab==="overview") renderOverview(); });
loadAll();
setInterval(loadAll, 60000);
</script>
